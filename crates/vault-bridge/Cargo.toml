[package]
name = "vault-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vault-core.workspace = true
vault-service.workspace = true
vault-tunnel = { workspace = true, features = ["tls"] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["transport-io", "server"] }
rpassword = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
vault-relay.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync"] }
