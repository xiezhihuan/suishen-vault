[package]
name = "suishen-vault-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "suishen_vault_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
vault-core.workspace = true
vault-service.workspace = true
zeroize.workspace = true
hex = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGSession"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString", "CFNumber", "CFBase"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_Foundation"] }

[dev-dependencies]
vault-relay.workspace = true
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }
