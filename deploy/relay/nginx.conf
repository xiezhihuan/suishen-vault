# 放到 /etc/nginx/conf.d/vault-relay.conf，把 relay.example.com 与证书路径换成你的。
# 这个文件在 http {} 里被包含。

map $http_upgrade $vault_relay_connection {
    default upgrade;
    ""      "";
}

server {
    listen 443 ssl;
    server_name relay.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.3;

    # 不记录来访地址与请求行。错误日志也会带地址，只留严重错误。
    access_log off;
    error_log  /dev/null crit;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:7470;
        proxy_http_version 1.1;
        # 必须是 $http_host：设备的身份签名绑定了完整主机名（含端口）
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vault_relay_connection;
        proxy_set_header X-Forwarded-For $remote_addr;

        # 不缓冲，避免直连模式的请求与响应落到临时文件
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_body_buffer_size 64k;

        proxy_connect_timeout 3s;
        # 隧道每 10 秒有心跳
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 跳板进程没在运行时，答复也与离线相同
    error_page 502 504 =503 @offline;
    location @offline {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"error":"unavailable"}';
    }
}
