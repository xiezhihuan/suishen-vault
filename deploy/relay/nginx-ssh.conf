# 只给 ssh -R 方案用：不经过 vault-relay，Nginx 直接代理到反向端口。
# 放到 /etc/nginx/conf.d/vault-ssh.conf，换掉域名与证书路径。
server {
    listen 443 ssl;
    server_name relay.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.3;

    access_log off;
    error_log  /dev/null crit;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:47600;
        proxy_http_version 1.1;
        # 本机服务只认回环主机名，端口要与 App 设置里的一致
        proxy_set_header Host 127.0.0.1:47600;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_body_buffer_size 64k;
    }
    error_page 502 504 =503 @offline;
    location @offline {
        default_type application/json;
        return 503 '{"error":"unavailable"}';
    }
}
