[workspace]
resolver = "3"
members = [
  "crates/vault-core",
  "crates/vault-service",
  "crates/vault-relay",
  "crates/vault-bridge",
  "apps/client/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
vault-service = { path = "crates/vault-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }

# vault-core：密码学只用 RustCrypto 与同类成熟库
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = { version = "0.11", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
unicode-normalization = "0.1"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
csv-core = "0.1"
url = "2.5"
thiserror = "2"
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# 防止把敏感值顺手打印出来：正式日志走统一的白名单日志层
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev]
# 控制磁盘占用：本机可用空间约 20GB
debug = "line-tables-only"

# Argon2id 的安全下限固定为 64 MiB、3 次，测试不降参数，所以只优化密码学依赖
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
